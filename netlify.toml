[build]
  command = "npm run build"
  publish = "public"
  # Manual-deploy only: build ONLY when triggered by a Netlify Build Hook
  # (Netlify sets INCOMING_HOOK_TITLE for hook builds). Git pushes run this
  # ignore script, which exits 0 → Netlify skips the build. Hook builds exit 1 → build.
  ignore = "if [ -n \"$INCOMING_HOOK_TITLE\" ]; then exit 1; else exit 0; fi"

[build.environment]
  NODE_VERSION = "20"
  GATSBY_API_BASE_URL = "https://a2zpos-78490f.ingress-baronn.ewp.live"
  GATSBY_SITE_URL = "https://a2zpos.io"
  GATSBY_DEFAULT_TITLE = "A2Z POS — All-in-One POS for Liquor Stores & Neighborhood Markets"
  GATSBY_DEFAULT_DESCRIPTION = "One platform for POS, inventory, suppliers, payments, and reporting. Built for liquor stores and neighborhood markets."

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
